name: Feature Request
description: 建议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 为什么要这个功能？解决了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 期望的行为或能力
    validations:
      required: true
  - type: textarea
    id: impl
    attributes:
      label: 实现思路（可选）
      description: 技术方案、涉及模块、API 设计等
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高
        - 中
        - 低
