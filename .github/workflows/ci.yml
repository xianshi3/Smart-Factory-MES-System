name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 123455
          MYSQL_DATABASE: mes_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mes-frontend/package-lock.json

      - name: Build with Maven
        run: mvn clean package -q
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: 123455
          LOG_LEVEL: warn

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client >/dev/null 2>&1
          mysql -h 127.0.0.1 -P 3306 -uroot -p123455 --default-character-set=utf8mb4 mes_db < sql/init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123455 -e "SELECT COUNT(*) AS users FROM mes_db.sys_user"

      - name: Install Frontend Dependencies
        run: |
          cd mes-frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd mes-frontend
          npm run lint

      - name: Type Check Frontend
        run: |
          cd mes-frontend
          npm run type-check

      - name: Unit Test Frontend (vitest)
        run: |
          cd mes-frontend
          npm test

      - name: Build Frontend
        run: |
          cd mes-frontend
          npm run build

  # 真实启动后端服务验证（防止"编译通过但运行时挂掉"，例如依赖缺失、Bean 初始化失败、权限链断裂）
  # 注：mes-dashboard 依赖 InfluxDB/Kafka，未纳入本次冒烟
  smoke:
    name: Backend smoke test (真实启动 + 认证链路)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 123455
          MYSQL_DATABASE: mes_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package backend
        run: mvn clean package -DskipTests -q

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client >/dev/null 2>&1

      - name: Smoke test
        run: bash scripts/ci-smoke.sh
