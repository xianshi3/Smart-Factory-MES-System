services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: mes-nacos
    restart: always
    ports:
      - "8848:8848"
    environment:
      MODE: standalone
    networks:
      - mes-network

  seata:
    image: seataio/seata-server:1.7.0
    container_name: mes-seata
    restart: always
    ports:
      - "8091:8091"
    environment:
      SEATA_IP: seata
    networks:
      - mes-network

  influxdb:
    image: influxdb:2.7-alpine
    container_name: mes-influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: mes
      DOCKER_INFLUXDB_INIT_BUCKET: mes_metrics
      # 固定 token，与 mes-dashboard application.yml 默认值一致（容器重建后不变）
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: Y2FrwpCCgedJZv_aX6mFnKMrKegGEY0kFWlEqVquhIZOX5lCO_MnqJz_vNKGTJW6q6W6cekL8BO9SS8nv-8ZmQ==
    networks:
      - mes-network

  mes-auth:
    build:
      context: ./mes-auth
      dockerfile: Dockerfile
    container_name: mes-auth
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
      - nacos
    networks:
      - mes-network

  mes-gateway:
    build:
      context: ./mes-gateway
      dockerfile: Dockerfile
    container_name: mes-gateway
    restart: always
    ports:
      - "8080:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
      - nacos
    networks:
      - mes-network

  mes-workorder:
    build:
      context: ./mes-workorder
      dockerfile: Dockerfile
    container_name: mes-workorder
    restart: always
    ports:
      - "8082:8082"
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
      - nacos
    networks:
      - mes-network

  mes-process:
    build:
      context: ./mes-process
      dockerfile: Dockerfile
    container_name: mes-process
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
      - nacos
    networks:
      - mes-network

  mes-quality:
    build:
      context: ./mes-quality
      dockerfile: Dockerfile
    container_name: mes-quality
    restart: always
    ports:
      - "8084:8084"
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mysql
      - redis
      - kafka
      - nacos
    networks:
      - mes-network

  mes-dashboard:
    build:
      context: ./mes-dashboard
      dockerfile: Dockerfile
    container_name: mes-dashboard
    restart: always
    ports:
      - "8085:8085"
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db
      SPRING_REDIS_HOST: redis
      INFLUXDB_URL: http://influxdb:8086
    depends_on:
      - mysql
      - redis
      - influxdb
      - nacos
    networks:
      - mes-network

networks:
  mes-network:
    driver: bridge