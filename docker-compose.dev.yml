services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: mes-influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-123455}
      DOCKER_INFLUXDB_INIT_ORG: mes
      DOCKER_INFLUXDB_INIT_BUCKET: mes_metrics
      # 固定 token，与 mes-dashboard 的 INFLUXDB_TOKEN 保持一致（容器重建后不变）
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-kUVlFGXR2YxkzRUzn9bW9dJazYkigOU6GyYlKLdGsF7ekBLLz9URVnOLMmFZViLy}
    healthcheck:
      test: ["CMD-SHELL", "influx ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - mes-network

  mes-auth:
    build:
      context: ./mes-auth
      dockerfile: Dockerfile
    container_name: mes-auth
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123455}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes-network

  mes-gateway:
    build:
      context: ./mes-gateway
      dockerfile: Dockerfile
    container_name: mes-gateway
    restart: always
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MES_AUTH_URI: http://mes-auth:8081
      MES_WORKORDER_URI: http://mes-workorder:8082
      MES_PROCESS_URI: http://mes-process:8083
      MES_QUALITY_URI: http://mes-quality:8084
      MES_DASHBOARD_URI: http://mes-dashboard:8085
      MES_DASHBOARD_WS_URI: ws://mes-dashboard:8085
      MES_AI_URI: http://mes-ai-service:8087
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mes-auth:
        condition: service_started
    networks:
      - mes-network

  mes-workorder:
    build:
      context: ./mes-workorder
      dockerfile: Dockerfile
    container_name: mes-workorder
    restart: always
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123455}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes-network

  mes-process:
    build:
      context: ./mes-process
      dockerfile: Dockerfile
    container_name: mes-process
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123455}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mes-network

  mes-quality:
    build:
      context: ./mes-quality
      dockerfile: Dockerfile
    container_name: mes-quality
    restart: always
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123455}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mes-network

  mes-dashboard:
    build:
      context: ./mes-dashboard
      dockerfile: Dockerfile
    container_name: mes-dashboard
    restart: always
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123455}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-kUVlFGXR2YxkzRUzn9bW9dJazYkigOU6GyYlKLdGsF7ekBLLz9URVnOLMmFZViLy}
      JWT_SECRET: ${JWT_SECRET:-MesDevOnlyJwtSecret-ChangeMe-InProd-2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - mes-network

volumes:
  influxdb-data:

networks:
  mes-network:
    driver: bridge
