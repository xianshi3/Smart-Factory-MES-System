server:
  port: 9090

spring:
  application:
    name: mes-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: mes-auth
          uri: http://mes-auth:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: mes-workorder
          uri: http://mes-workorder:8082
          predicates:
            - Path=/api/workorder/**
          filters:
            - StripPrefix=1
        - id: mes-process
          uri: http://mes-process:8083
          predicates:
            - Path=/api/process/**
          filters:
            - StripPrefix=1
        - id: mes-quality
          uri: http://mes-quality:8084
          predicates:
            - Path=/api/quality/**
          filters:
            - StripPrefix=1
        - id: mes-dashboard
          uri: http://mes-dashboard:8085
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1
        - id: mes-alarm
          uri: http://mes-dashboard:8085
          predicates:
            - Path=/api/alarm/**
          filters:
            - StripPrefix=1
        - id: mes-ai
          uri: http://mes-ai-service:8087
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
        - id: mes-dashboard-ws
          uri: ws://mes-dashboard:8085
          predicates:
            - Path=/api/ws/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics