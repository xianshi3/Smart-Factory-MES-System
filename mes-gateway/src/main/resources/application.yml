server:
  port: ${SERVER_PORT:9090}
  shutdown: graceful

spring:
  application:
    name: mes-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: mes-auth
          uri: ${MES_AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: mes-workorder
          uri: ${MES_WORKORDER_URI:http://localhost:8082}
          predicates:
            - Path=/api/workorder/**
          filters:
            - StripPrefix=1
        - id: mes-process
          uri: ${MES_PROCESS_URI:http://localhost:8083}
          predicates:
            - Path=/api/process/**
          filters:
            - StripPrefix=1
        - id: mes-quality
          uri: ${MES_QUALITY_URI:http://localhost:8084}
          predicates:
            - Path=/api/quality/**
          filters:
            - StripPrefix=1
        - id: mes-dashboard
          uri: ${MES_DASHBOARD_URI:http://localhost:8085}
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1
        - id: mes-alarm
          uri: ${MES_DASHBOARD_URI:http://localhost:8085}
          predicates:
            - Path=/api/alarm/**
          filters:
            - StripPrefix=1
        - id: mes-ai
          uri: ${MES_AI_URI:http://localhost:8086}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: when-authorized
