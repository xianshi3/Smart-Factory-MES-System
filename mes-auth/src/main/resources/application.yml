# MES Auth Service Configuration
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

spring:
  application:
    name: mes-auth
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/mes_db?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123455}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 1s
      lettuce:
        pool:
          enabled: false

  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml,classpath*:mapper/**/*.xml
    type-aliases-package: com.mes.common.entity
    global-config:
      db-config:
        id-type: assign_id
    configuration:
      map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.mes: ${LOG_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
