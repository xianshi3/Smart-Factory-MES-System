# MES Auth Service Configuration
server:
  port: 8081
  error:
    include-message: always
    include-stacktrace: always
    include-exception: true

spring:
  application:
    name: mes-auth
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mes_db?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  # 扫描common模块的mapper
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mes.common.entity

jwt:
  secret: SmartFactoryMES2024SecretKeyForJWTTokenGeneration!
  expiration: 86400000

logging:
  level:
    com.mes: debug
