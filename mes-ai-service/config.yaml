server:
  host: "0.0.0.0"
  port: 8087

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "123455"
  database: "mes_db"

model:
  quality:
    onnx_path: "src/models/saved_models/quality_predict.onnx"
    version: "1.0.0"
  production:
    onnx_path: "src/models/saved_models/output_predict.onnx"
    version: "1.0.0"

llm:
  api_key: "${ZHIPU_API_KEY}"
  model: "glm-4-flash"
  rate_limit: 60

kafka:
  bootstrap_servers: "localhost:9092"
  group_id: "ai-service-group"
  topics:
    - "mes-device-data"

redis:
  host: "localhost"
  port: 6379
  db: 1

feature:
  sliding_window_size: 60
  aggregation_interval: 10
