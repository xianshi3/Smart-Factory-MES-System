server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  error:
    include-message: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

spring:
  application:
    name: mes-dashboard
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/mes_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mes-dashboard-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mes.dashboard.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

influxdb:
  # 设备历史遥测时序存储（默认连本机 docker-compose.dev.yml 的 InfluxDB，IDE 直接启动即可用）
  # 如需覆盖: 设置环境变量 INFLUXDB_URL / INFLUXDB_TOKEN
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN:Y2FrwpCCgedJZv_aX6mFnKMrKegGEY0kFWlEqVquhIZOX5lCO_MnqJz_vNKGTJW6q6W6cekL8BO9SS8nv-8ZmQ==}
  org: ${INFLUXDB_ORG:mes}
  bucket: ${INFLUXDB_BUCKET:mes_metrics}

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
