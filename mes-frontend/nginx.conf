# Virtual Path MES 前端 nginx（容器内，监听 3000）
# 架构：浏览器 → Cloudflare Tunnel (Flexible SSL) → 本容器 :3000 → /api 代理 → mes-gateway:9090

# Cloudflare Flexible SSL：浏览器→CF 为 https，CF→源站为 http 且带 X-Forwarded-Proto: https。
# 透传该头给网关，避免后端把请求误判为 http（影响重定向与安全头）。
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" https;
}

# WebSocket：仅当客户端真的带 Upgrade 头时才升级，普通 HTTP 请求保持 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # History router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API to backend (Spring Cloud Gateway)
    location /api/ {
        proxy_pass http://mes-gateway:9090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # WebSocket 升级（前端 3D 孪生实时数据 /api/ws/dashboard）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
    }
}
